<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Validação A e B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Comparador A &lt; B</h1>
    <form id="meuFormulario">
      <input type="number" id="campoA" name="campoA" placeholder="Digite o valor de A" required>
      <input type="number" id="campoB" name="campoB" placeholder="Digite o valor de B" required>
      <button type="submit">Validar</button>
      <p id="mensagem"></p>
    </form>
  </div>
  <script defer src="script.js"></script>
</body>
</html>
